name: Scribe engine

# Tests the Rust dictation engine and fails the build when a budget from
# ADR-0074 is missed: hotkey to recording 50 ms, idle RAM 30 MB, cold start 2 s.
# Hosted runners have no microphone, so the bench uses --null-audio: it times the
# hook-to-capture path, not the device open. Real-mic numbers live on the task card.

on:
  pull_request:
    paths:
      - "services/scribe-engine/**"
      - ".github/workflows/scribe-engine.yml"
  push:
    branches:
      - main
    paths:
      - "services/scribe-engine/**"
      - ".github/workflows/scribe-engine.yml"

permissions:
  contents: read

jobs:
  test-and-budgets:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # whisper-rs builds whisper.cpp with CMake and needs libclang; both ship on windows-latest.
      LIBCLANG_PATH: C:/Program Files/LLVM/bin
    defaults:
      run:
        working-directory: services/scribe-engine
    steps:
      - uses: actions/checkout@v6
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Release build
        run: cargo build --release
      - name: Budgets
        run: ./target/release/scribe-bench.exe --null-audio
      - name: Restore offline model
        uses: actions/cache@v4
        with:
          path: services/scribe-engine/target/models
          key: whisper-ggml-base.en-q5_1
      # whisper.cpp built without AVX2 and /O2 is about 8x slower. A clean 3.9 s WAV
      # must transcribe in 3 s or less, so such a build fails here.
      - name: Offline speed (AVX2 guard)
        run: ./target/release/scribe-bench.exe --local-wav tests/fixtures/clean-speech-16k.wav --models target/models

  # The engine runs headless on macOS for now (no hotkey, paste or pill yet; see the Mac Scribe
  # phase cards). This job proves it builds and passes its tests on Apple Silicon.
  test-macos:
    runs-on: macos-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: services/scribe-engine
    steps:
      - uses: actions/checkout@v6
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Release build
        run: cargo build --release
